name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"] 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build package
        run: npm run build --if-present

      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.1_checksums.txt
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Sync server.json version with package.json
        # The registry rejects duplicate top-level versions, so the server
        # version must move with every release. Derive both it and the npm
        # package version from package.json rather than hand-editing.
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
